[project]
name = "itg"
version = "0.1.0"
description = "Inside the Game: explainable, personalised match intelligence from synthetic football events"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
azure = [
  "openai>=1.40",
  "azure-identity>=1.17",
  "azure-eventhub>=5.11",
]
agents = [
  # Microsoft Agent Framework (needs Python 3.10+); see README "Agent Framework wiring"
  "agent-framework",
]
vision = ["opencv-python-headless", "ultralytics", "scikit-learn"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
itg = ["static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
